mode:
  type: Standalone
props:
  sql-show: true
dataSources:
  master:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://debian-server:3307/url-convert?allowPublicKeyRetrieval=true
    username: root
    password: wei5877261
  slave:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://debian-server:3308/url-convert?allowPublicKeyRetrieval=true
    username: root
    password: wei5877261

rules:
#  - !SINGLE
#    tables:
#      - "*.*"
  - !READWRITE_SPLITTING
    dataSourceGroups:
      rw_group0:
        writeDataSourceName: master
        readDataSourceNames:
          - slave
        loadBalancerName: random
        transactionalReadQueryStrategy: PRIMARY
    loadBalancers:
      random:
        type: RANDOM
  - !SHARDING
    tables:
      url_map:
        actualDataNodes: rw_group0.url_map
        tableStrategy:
          standard:
            shardingColumn: id
            shardingAlgorithmName: timestamp_mm

    shardingAlgorithms:
      timestamp_mm:
        type: CLASS_BASED
        props:
          strategy: STANDARD
          algorithmClassName: cc.xiaowei.url_convert.common.IdTimeStampStandardShardingAlgorithm