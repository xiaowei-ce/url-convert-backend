spring:
  application:
    name: url-convert-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: prod

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sharding-tables-vals:
  table-name-template: url_map_<{}> #<{}> will be replaced eg: url_map_202606
  lower-date: 202606
  upper-date: 205012
  date-pattern: yyyyMM